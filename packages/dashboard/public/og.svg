<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#000"/>

  <!-- Subtle grid -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Center dot — like Vercel but with a cool white glow -->
  <circle cx="600" cy="260" r="40" fill="rgba(255,255,255,0.06)"/>
  <circle cx="600" cy="260" r="24" fill="rgba(255,255,255,0.1)"/>
  <circle cx="600" cy="260" r="10" fill="#fff"/>

  <!-- Outer glow ring -->
  <circle cx="600" cy="260" r="60" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="600" cy="260" r="90" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Title -->
  <text x="600" y="370" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="600" letter-spacing="-0.5">RoboLedger</text>

  <!-- Subtitle -->
  <text x="600" y="410" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="Inter, system-ui, sans-serif" font-size="18" letter-spacing="0.1em">ERC-8004 for Physical Robots</text>

  <!-- Bottom accent line -->
  <line x1="520" y1="450" x2="680" y2="450" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Three small dots for the three registries -->
  <circle cx="570" cy="480" r="4" fill="rgba(255,255,255,0.3)"/>
  <circle cx="600" cy="480" r="4" fill="rgba(255,255,255,0.5)"/>
  <circle cx="630" cy="480" r="4" fill="rgba(255,255,255,0.3)"/>

  <text x="570" y="510" text-anchor="middle" fill="rgba(255,255,255,0.15)" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.15em">IDENTITY</text>
  <text x="600" y="510" text-anchor="middle" fill="rgba(255,255,255,0.15)" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.15em">REPUTATION</text>
  <text x="630" y="510" text-anchor="middle" fill="rgba(255,255,255,0.15)" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.15em">VALIDATION</text>

  <!-- Corner marks -->
  <path d="M 30,30 L 30,50 M 30,30 L 50,30" stroke="rgba(255,255,255,0.1)" stroke-width="1" fill="none"/>
  <path d="M 1170,30 L 1170,50 M 1170,30 L 1150,30" stroke="rgba(255,255,255,0.1)" stroke-width="1" fill="none"/>
  <path d="M 30,600 L 30,580 M 30,600 L 50,600" stroke="rgba(255,255,255,0.1)" stroke-width="1" fill="none"/>
  <path d="M 1170,600 L 1170,580 M 1170,600 L 1150,600" stroke="rgba(255,255,255,0.1)" stroke-width="1" fill="none"/>
</svg>
